name: Institutional AI Opportunity Scanner

on:
  schedule:
    # Run every hour at minute 0 (24 times / day)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Environment Secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set in GitHub repository settings. Dedicated crawlers (InsideKampus, Devpost, BITS Oasis) will continue running. To enable AI portal extraction, add GEMINI_API_KEY in Repository Settings > Secrets > Actions."
          fi

      - name: Run Institutional AI Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ncnkzlugelkhafjtupbf.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/scrape_institutional.js
