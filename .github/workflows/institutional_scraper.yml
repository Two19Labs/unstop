name: Listings Scraper (Devpost, InsideKampus, corporate challenges)

on:
  schedule:
    # Every 6 hours. GitHub delays or drops busier schedules, so hourly never actually ran hourly.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Environment Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_KEY is not set: the scraper cannot save listings."
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY is not set: the curated corporate challenges are skipped (Devpost and InsideKampus still run)."
          fi

      # Fails the run (and GitHub emails you) if saving fails or every source breaks
      - name: Scrape and sync listings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ncnkzlugelkhafjtupbf.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scrape_institutional.js
